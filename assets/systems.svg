<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">What I'm building</title>
<desc id="desc">Hexus, Computer Control MCP, OpsDesk, and Rill.</desc>
<style>
  .base{fill:#050607;stroke:#24282d}.card{fill:#0b0d10;stroke:#24282d}.fg{fill:#f3f4f6}.muted{fill:#a9b1ba}.dim{fill:#66707a}
  @media (prefers-color-scheme: light){.base{fill:#ffffff;stroke:#d8dee4}.card{fill:#f6f8fa;stroke:#d8dee4}.fg{fill:#17191c}.muted{fill:#59636e}.dim{fill:#7a838c}}
</style>
<rect x="1" y="1" width="998" height="468" rx="18" class="base" stroke-width="2"/>
<text x="34" y="44" class="fg" font-family="Segoe UI,Arial" font-size="22" font-weight="700">What I'm building</text>
<text x="34" y="69" class="muted" font-family="Segoe UI,Arial" font-size="13">Most of the interesting stuff is private, so here's the short version.</text>
<text x="964" y="46" text-anchor="end" class="fg" font-family="Consolas,monospace" font-size="17" font-weight="700">&lt;/Cy&gt;</text>
<line x1="34" y1="88" x2="966" y2="88" stroke="#20252b"/>

<rect x="34" y="114" width="448" height="132" rx="12" class="card"/>
<circle cx="60" cy="141" r="5" fill="#8dff78"/>
<text x="76" y="147" class="fg" font-family="Segoe UI,Arial" font-size="20" font-weight="700">Hexus</text>
<text x="448" y="145" text-anchor="end" fill="#8dff78" font-family="Consolas,monospace" font-size="11">MAIN PROJECT</text>
<text x="60" y="176" class="muted" font-family="Segoe UI,Arial" font-size="13">My native work harness — projects, agents, tools, and the</text>
<text x="60" y="196" class="muted" font-family="Segoe UI,Arial" font-size="13">machine itself, pulled into one place I actually enjoy using.</text>
<text x="60" y="224" class="dim" font-family="Consolas,monospace" font-size="11">RUST · GPUI · SQLITE</text>

<rect x="518" y="114" width="448" height="132" rx="12" class="card"/>
<circle cx="544" cy="141" r="5" fill="#69c8ff"/>
<text x="560" y="147" class="fg" font-family="Segoe UI,Arial" font-size="20" font-weight="700">Computer Control MCP</text>
<text x="932" y="145" text-anchor="end" fill="#69c8ff" font-family="Consolas,monospace" font-size="11">IN USE</text>
<text x="544" y="176" class="muted" font-family="Segoe UI,Arial" font-size="13">The bridge I use to let agents operate Windows without</text>
<text x="544" y="196" class="muted" font-family="Segoe UI,Arial" font-size="13">turning every action into screenshot-and-click guesswork.</text>
<text x="544" y="224" class="dim" font-family="Consolas,monospace" font-size="11">RUST · WINDOWS · IPC · MCP</text>

<rect x="34" y="270" width="448" height="132" rx="12" class="card"/>
<circle cx="60" cy="297" r="5" fill="#8dff78"/>
<text x="76" y="303" class="fg" font-family="Segoe UI,Arial" font-size="20" font-weight="700">OpsDesk</text>
<text x="448" y="301" text-anchor="end" fill="#8dff78" font-family="Consolas,monospace" font-size="11">DEMO</text>
<text x="60" y="332" class="muted" font-family="Segoe UI,Arial" font-size="13">A demo of the private business software I want to build:</text>
<text x="60" y="352" class="muted" font-family="Segoe UI,Arial" font-size="13">roles, approvals, imports, audit trails, and local data.</text>
<text x="60" y="380" class="dim" font-family="Consolas,monospace" font-size="11">RUST · GPUI · SQLITE</text>

<rect x="518" y="270" width="448" height="132" rx="12" class="card"/>
<circle cx="544" cy="297" r="5" fill="#69c8ff"/>
<text x="560" y="303" class="fg" font-family="Segoe UI,Arial" font-size="20" font-weight="700">Rill</text>
<text x="932" y="301" text-anchor="end" fill="#69c8ff" font-family="Consolas,monospace" font-size="11">EXPERIMENT</text>
<text x="544" y="332" class="muted" font-family="Segoe UI,Arial" font-size="13">A native music player I keep using to push GPUI + Rive</text>
<text x="544" y="352" class="muted" font-family="Segoe UI,Arial" font-size="13">motion, window behaviour, and UI polish a little further.</text>
<text x="544" y="380" class="dim" font-family="Consolas,monospace" font-size="11">RUST · GPUI · RIVE</text>

</svg>