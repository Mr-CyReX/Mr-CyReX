<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Cy's stack</title>
<desc id="desc">Primary stack, motion tools, and supporting languages and tooling.</desc>
<style>
  .panel{fill:#080a0d;stroke:#24282d}.fg{fill:#f3f4f6}.muted{fill:#98a1ab}.dim{fill:#68717b}
  @media (prefers-color-scheme: light){.panel{fill:#f7f8fa;stroke:#d8dee4}.fg{fill:#17191c}.muted{fill:#59636e}.dim{fill:#7a838c}}
</style>
<rect x="1" y="1" width="998" height="248" rx="18" class="panel" stroke-width="2"/>
<text x="38" y="48" class="fg" font-family="Segoe UI,Arial" font-size="22" font-weight="700">Stack</text>

<circle cx="42" cy="91" r="5" fill="#8dff78"/>
<text x="60" y="98" class="dim" font-family="Consolas,monospace" font-size="11" letter-spacing="1">PRIMARY</text>
<text x="60" y="132" class="fg" font-family="Segoe UI,Arial" font-size="25" font-weight="650">Rust · GPUI · SQLite</text>
<text x="60" y="161" class="muted" font-family="Segoe UI,Arial" font-size="14">Windows-native tooling · PowerShell</text>

<line x1="500" y1="72" x2="500" y2="204" stroke="#24282d"/>

<circle cx="540" cy="91" r="5" fill="#69c8ff"/>
<text x="558" y="98" class="dim" font-family="Consolas,monospace" font-size="11" letter-spacing="1">UI + MOTION</text>
<text x="558" y="128" class="fg" font-family="Segoe UI,Arial" font-size="18" font-weight="650">Rive · GPUI · Slint</text>

<text x="558" y="171" class="dim" font-family="Consolas,monospace" font-size="11" letter-spacing="1">ALSO</text>
<text x="558" y="200" class="muted" font-family="Segoe UI,Arial" font-size="15">C++ · TypeScript · Go · Docker · Git</text>

<path d="M38 220 C190 205 319 232 458 216 C626 197 760 230 962 208" fill="none" stroke="#69c8ff" stroke-width="2" stroke-linecap="round"/>
<circle cx="38" cy="220" r="4" fill="#8dff78"/>
<circle cx="962" cy="208" r="4" fill="#69c8ff"/>
</svg>